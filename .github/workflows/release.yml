name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency: release

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # semantic-release needs the full history and tags to find the last release.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: >-
          npx --yes
          -p semantic-release@25.0.9
          -p @semantic-release/exec@7.1.0
          -p @semantic-release/git@11.0.1
          -p conventional-changelog-conventionalcommits@9.3.1
          semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
